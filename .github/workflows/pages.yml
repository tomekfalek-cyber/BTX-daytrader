name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore core modules and patch syntax
        run: |
          set -e
          # ALWAYS restore autonomy + pro-edge (main often had PLACEHOLDER)
          curl -sL "https://raw.githubusercontent.com/tomekfalek-cyber/BTX-daytrader/da57a27fea51194738a7c49034b964623d3a4d98/autonomy-pro.js" -o autonomy-pro.js
          curl -sL "https://raw.githubusercontent.com/tomekfalek-cyber/BTX-daytrader/91cae43a82045c562cb4d1ceb2f8cd6a0c88d3b5/pro-edge.js" -o pro-edge.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          # Active DT score
          ap = Path('autonomy-pro.js')
          t = ap.read_text(encoding='utf-8').replace('score >= 70', 'score >= 63')
          ap.write_text(t, encoding='utf-8')
          # pro-edge soft thresholds
          pe = Path('pro-edge.js')
          p = pe.read_text(encoding='utf-8')
          p = p.replace('base.score < 70', 'base.score < 63')
          pe.write_text(p, encoding='utf-8')
          # engine-hardening: fix broken multiline string if present
          eh = Path('engine-hardening.js')
          if eh.exists():
              h = eh.read_text(encoding='utf-8')
              h2 = re.sub(
                  r"el\.innerHTML \+=\s*\n\s*'<div class=\"mut\"[^']*$\n\s*[^']*</div>';",
                  'el.innerHTML += \'<div class="mut" style="margin-top:8px;color:#fbbf24">Uwaga: 250 to swiece 5-min, nie 250 sesji. Wynik orientacyjny.</div>\';',
                  h,
                  flags=re.M,
              )
              # simpler replace of known broken fragment
              h2 = h2.replace(
                  '"250" to 250 \u015bwiec 5-min (symulacja),\n           nie 250 sesji',
                  '"250" to 250 swiec 5-min (symulacja), nie 250 sesji'
              )
              # raw broken lines join
              lines = h2.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if '250 \u015bwiec 5-min (symulacja),' in lines[i] or '250 świec 5-min (symulacja),' in lines[i]:
                      out.append("          el.innerHTML += '<div class=\"mut\" style=\"margin-top:8px;color:#fbbf24\">Uwaga: 250 to swiece 5-min, nie 250 sesji. Wynik orientacyjny.</div>';")
                      # skip continuation lines until ;
                      i += 1
                      while i < len(lines) and 'div>' not in lines[i]:
                          i += 1
                      i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              eh.write_text('\n'.join(out) + '\n', encoding='utf-8')
              print('engine-hardening patched')
          print('restored autonomy', ap.stat().st_size, 'edge', pe.stat().st_size)
          PY
          # syntax gate
          node --check autonomy-pro.js
          node --check pro-edge.js
          if [ -f engine-hardening.js ]; then node --check engine-hardening.js; fi
          if [ -f trade-hero.js ]; then node --check trade-hero.js || true; fi

      - name: Force 8-symbol universe into index.html
        run: |
          python3 << 'PY'
          import re, pathlib
          UNI = """[
          {s:'NVDA',n:'NVIDIA',t:'Akcja',b:140,v:0.0022,mkt:'US'},
          {s:'TSLA',n:'Tesla',t:'Akcja',b:250,v:0.0024,mkt:'US'},
          {s:'META',n:'Meta Platforms',t:'Akcja',b:580,v:0.0018,mkt:'US'},
          {s:'AAPL',n:'Apple',t:'Akcja',b:230,v:0.0014,mkt:'US'},
          {s:'QQQ',n:'Nasdaq 100 ETF',t:'ETF',b:480,v:0.0012,mkt:'US'},
          {s:'SPY',n:'S&P 500 ETF',t:'ETF',b:560,v:0.0009,mkt:'US'},
          {s:'EURUSD',n:'EUR/USD',t:'FX',b:1.08,v:0.00035,mkt:'FX'},
          {s:'XAU/USD',n:'Zloto (Gold)',t:'FX',b:2650,v:0.0008,mkt:'FX'}
          ]"""
          for path in ['index.html','dashboard/index.html']:
              p=pathlib.Path(path)
              if not p.exists(): continue
              h=p.read_text(encoding='utf-8',errors='replace')
              h2,n=re.subn(r'((?:var\s+)?SYMBOLS\s*=\s*)\[(?:[^\[\]]|\[[^\]]*\])*\]',lambda m:m.group(1)+UNI,h)
              h2=h2.replace('CFG.autoSec||60','CFG.autoSec||180').replace('autoSec||60','autoSec||180')
              p.write_text(h2,encoding='utf-8')
          PY

      - name: Wire client modules into index.html
        run: |
          set -e
          inject() {
            local f="$1"
            if [ ! -f "$f" ]; then return 0; fi
            for s in universe-pro.js auto-180.js strategy-pro.js ai-ensemble.js export-csv.js scan-countdown.js ai-panel.js coach-ui.js pro-desk.js settings-fix.js vpvr-session.js pro-upgrade-6.js learner-pack.js guide-7days.js macro-calendar.js xtb-bridge.js chart-ta-lesson.js autonomy-pro.js xtb-api-connect.js pro-assistant.js quality-cap.js ui-plain-polish.js pro-edge.js active-dt-mode.js dt-final-pack.js trade-hero.js engine-hardening.js; do
              if [ ! -f "$s" ]; then continue; fi
              if ! grep -q "$s" "$f"; then
                if grep -q '</body>' "$f"; then
                  sed -i "s|</body>|\\n<script src=\"$s\"></script>\\n</body>|" "$f"
                  echo "Injected $s into $f"
                fi
              else
                echo "$f already has $s"
              fi
            done
          }
          inject index.html
          inject dashboard/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
