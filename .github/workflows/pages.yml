name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire client modules into index.html
        run: |
          set -e
          inject() {
            local f="$1"
            if [ ! -f "$f" ]; then return 0; fi
            for s in strategy-pro.js ai-ensemble.js export-csv.js scan-countdown.js ai-panel.js coach-ui.js; do
              if [ ! -f "$s" ]; then continue; fi
              if ! grep -q "$s" "$f"; then
                if grep -q '</body>' "$f"; then
                  sed -i "s|</body>|\\n<script src=\"$s\"></script>\\n</body>|" "$f"
                  echo "Injected $s into $f"
                fi
              else
                echo "$f already has $s"
              fi
            done
          }
          inject index.html
          inject dashboard/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
