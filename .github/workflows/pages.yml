name: Deploy static site to Pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - krytyczne moduly nie moga byc puste/placeholder
        run: |
          for f in autonomy-pro.js strategy-pro.js index.html btx-entry-engine.js skip-reason-ui.js pro-elite-pack.js; do
            if [ ! -f "$f" ]; then echo "FAIL brak $f"; exit 1; fi
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 500 ]; then echo "FAIL $f ma tylko $sz B"; exit 1; fi
            if grep -q PLACEHOLDER "$f"; then echo "FAIL $f zawiera PLACEHOLDER"; exit 1; fi
          done
          if ! grep -q 'btx-skip-panel' index.html; then echo "FAIL brak radaru btx-skip-panel w index.html"; exit 1; fi
          if ! grep -q 'pro-elite-pack.js' index.html; then echo "FAIL brak pro-elite-pack w index.html"; exit 1; fi
      - name: Syntax check all client JS
        run: |
          fail=0
          for f in *.js; do
            [ -f "$f" ] || continue
            if [ "$(wc -c < "$f")" -lt 50 ]; then continue; fi
            if ! node --check "$f"; then echo "FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: Wszystkie <script src> z index.html istnieja
        run: |
          fail=0
          for s in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="//;s/"$//'); do
            case "$s" in http*) continue;; esac
            f="${s%%\?*}"
            if [ ! -f "$f" ]; then echo "BRAK $s (plik $f)"; fail=1; fi
          done
          exit $fail
      - name: Testy (nie blokuj deploy)
        continue-on-error: true
        run: npm test || true
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build slim site (bez archive/ .git)
        run: |
          mkdir -p _site
          # tylko assety klienta z roota — bez archive (duzy artifact psuje deploy)
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.txt' -o -name '*.md' -o -name '*.svg' -o -name '*.png' -o -name '*.ico' \) -exec cp -v {} _site/ \;
          # style / inne jesli w podfolderach uzywanych
          if [ -d dashboard ]; then cp -r dashboard _site/; fi
          ls -la _site | head -40
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
