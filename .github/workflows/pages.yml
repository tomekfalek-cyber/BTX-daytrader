name: Deploy static site to Pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - krytyczne moduly nie moga byc puste/placeholder
        run: |
          for f in autonomy-pro.js pro-edge.js strategy-pro.js index.html; do
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 500 ]; then echo "FAIL $f ma tylko $sz B"; exit 1; fi
            if grep -q PLACEHOLDER "$f"; then echo "FAIL $f zawiera PLACEHOLDER"; exit 1; fi
          done
      - name: Syntax check all client JS
        run: |
          fail=0
          for f in *.js; do
            [ -f "$f" ] || continue
            if [ "$(wc -c < "$f")" -lt 50 ]; then continue; fi
            if ! node --check "$f"; then echo "FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: Wszystkie <script src> z index.html istnieja
        run: |
          fail=0
          for s in $(grep -o '<script src="[^"]*"' index.html | sed 's/.*src="//;s/"$//'); do
            case "$s" in http*) continue;; esac
            if [ ! -f "$s" ]; then echo "BRAK $s"; fail=1; fi
          done
          exit $fail
      - name: Testy
        run: npm test
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4