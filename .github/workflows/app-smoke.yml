name: App smoke (czy bot handluje)
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Smoke całej aplikacji (3 dni, sztuczny zegar)
        run: npm run test:app
